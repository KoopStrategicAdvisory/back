openapi: 3.0.3
info:
  title: Koop Legal Management API
  version: 2.0.0
  description: |
    API para gestión integral de despacho de abogados.

    Cubre expedientes procesales, tareas, actuaciones, notificaciones,
    audiencias, documentos, finanzas (honorarios, pagos, gastos), Kanban
    y colaboración (comentarios, etiquetas, adjuntos, dependencias).

    ### Autenticación
    Todos los endpoints (excepto `/auth/register`, `/auth/login`,
    `/auth/forgot-password`, `/auth/reset-password` y `/auth/verify-email`)
    requieren un token JWT en la cabecera:

    ```
    Authorization: Bearer <accessToken>
    ```

    El `accessToken` se obtiene en `POST /auth/login`.
    Usa `POST /auth/refresh` para renovarlo sin re-autenticarse.

servers:
  - url: http://localhost:4000/api
    description: Desarrollo local
  - url: /api
    description: Producción (relativo)

security:
  - BearerAuth: []

tags:
  - name: Auth
    description: Registro, login, logout y gestión de sesión
  - name: Catálogos
    description: Datos de referencia (roles, tipos de proceso, etapas procesales, etc.)
  - name: Clientes
    description: Clientes del despacho
  - name: Users
    description: Usuarios internos del sistema
  - name: Expedientes
    description: Expedientes procesales y sus etapas
  - name: Iter Procesal
    description: Plantillas de itinerario procesal
  - name: Tareas
    description: Tareas del despacho y sus checklists
  - name: Actuaciones
    description: Actuaciones procesales registradas
  - name: Notificaciones
    description: Notificaciones judiciales
  - name: Audiencias
    description: Audiencias programadas
  - name: Documentos
    description: Metadatos de documentos del expediente
  - name: Financiero
    description: Honorarios, pagos y gastos del proceso
  - name: Kanban
    description: Tableros, columnas y posiciones Kanban
  - name: Colaboración
    description: Etiquetas, comentarios, adjuntos y dependencias

# ──────────────────────────────────────────────────────────────────────────────
# COMPONENTS
# ──────────────────────────────────────────────────────────────────────────────
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: integer }
    ItemIdPath:
      name: itemId
      in: path
      required: true
      schema: { type: integer }
    LimitQuery:
      name: limit
      in: query
      schema: { type: integer, default: 50 }
    OffsetQuery:
      name: offset
      in: query
      schema: { type: integer, default: 0 }
    ActiveQuery:
      name: active
      in: query
      schema: { type: boolean, default: true }

  schemas:
    # ── Genéricos ─────────────────────────────────────────────────────────────
    Error:
      type: object
      properties:
        message: { type: string }
      required: [message]

    ValidationError:
      type: object
      properties:
        message: { type: string, example: Datos inválidos. }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }

    MessageResponse:
      type: object
      properties:
        message: { type: string }

    # ── Auth ──────────────────────────────────────────────────────────────────
    UserPublic:
      type: object
      properties:
        id:      { type: integer, example: 1 }
        nombre:  { type: string,  example: Ana García }
        email:   { type: string,  format: email }
        active:  { type: boolean }
        roles:
          type: array
          items:
            type: object
            properties:
              id:     { type: integer }
              nombre: { type: string }

    AuthResponse:
      type: object
      properties:
        accessToken: { type: string }
        user:        { $ref: '#/components/schemas/UserPublic' }

    # ── Catálogos simples ─────────────────────────────────────────────────────
    CatalogItem:
      type: object
      properties:
        id:     { type: integer }
        nombre: { type: string }
        active: { type: boolean }

    Role:
      type: object
      properties:
        id:          { type: integer }
        nombre:      { type: string }
        descripcion: { type: string }
        active:      { type: boolean }

    TipoNotificacion:
      type: object
      properties:
        id:               { type: integer }
        nombre:           { type: string }
        fundamento_legal: { type: string }
        dias_surtimiento: { type: integer }
        descripcion:      { type: string }
        active:           { type: boolean }

    Prioridad:
      type: object
      properties:
        id:     { type: integer }
        nombre: { type: string }
        nivel:  { type: integer }
        active: { type: boolean }

    TipoProcCombo:
      type: object
      properties:
        id:                 { type: integer }
        id_tipo_proceso:    { type: integer }
        id_subtipo_proceso: { type: integer }
        id_tipo_pretension: { type: integer }
        active:             { type: boolean }

    EtapaProcesal:
      type: object
      properties:
        id:               { type: integer }
        id_tipo_proceso:  { type: integer }
        nombre_etapa:     { type: string }
        descripcion:      { type: string }
        fundamento_legal: { type: string }
        active:           { type: boolean }

    # ── Clientes ──────────────────────────────────────────────────────────────
    Cliente:
      type: object
      properties:
        id:               { type: integer }
        nombre:           { type: string,  example: Juan Pérez }
        tipo_persona:     { type: string,  enum: [NATURAL, JURIDICA] }
        tipo_documento:   { type: string,  enum: [CC, CE, PA, NIT, TI, PE] }
        numero_documento: { type: string }
        email:            { type: string,  format: email }
        telefono:         { type: string }
        active:           { type: boolean }

    # ── Users ─────────────────────────────────────────────────────────────────
    User:
      type: object
      properties:
        id:              { type: integer }
        nombre:          { type: string }
        email:           { type: string, format: email }
        active:          { type: boolean }
        cargo:           { type: string }
        especialidades:  { type: string }
        tarifa_hora:     { type: number }
        moneda_tarifa:   { type: string }
        last_login:      { type: string, format: date-time }
        created_at:      { type: string, format: date-time }
        roles:
          type: array
          items: { $ref: '#/components/schemas/CatalogItem' }

    # ── Expedientes ───────────────────────────────────────────────────────────
    Expediente:
      type: object
      properties:
        id:                                    { type: integer }
        numero_de_expediente:                  { type: string, example: EXP-2024-001 }
        id_usuario:                            { type: integer }
        id_cliente:                            { type: integer }
        id_calidad_usuario:                    { type: integer }
        id_tipo_proc_subtipo_proc_tipo_pre:    { type: integer }
        id_contraparte:                        { type: integer }
        juzgado_o_autoridad_que_conoce:        { type: string }
        id_estado_proceso:                     { type: integer }
        active:                                { type: boolean }

    ExpedienteEtapa:
      type: object
      properties:
        id:                     { type: integer }
        id_expediente:          { type: integer }
        id_iter_plantilla:      { type: integer }
        id_etapa:               { type: integer }
        orden:                  { type: integer }
        id_instancia:           { type: integer }
        id_estado_etapa:        { type: integer }
        fecha_inicio:           { type: string, format: date }
        fecha_vencimiento:      { type: string, format: date }
        fecha_fin_real:         { type: string, format: date }
        id_usuario_responsable: { type: integer }
        observaciones:          { type: string }
        active:                 { type: boolean }

    # ── Iter Procesal ─────────────────────────────────────────────────────────
    IterProcesalPlantilla:
      type: object
      properties:
        id:                                    { type: integer }
        id_tipo_proc_subtipo_proc_tipo_pre:    { type: integer }
        id_etapa:                              { type: integer }
        orden:                                 { type: integer }
        id_instancia:                          { type: integer }
        plazo_dias:                            { type: integer }
        dias_habiles:                          { type: boolean }
        dispara_notificacion:                  { type: boolean }
        es_obligatoria:                        { type: boolean }
        observaciones:                         { type: string }
        active:                                { type: boolean }

    TareaPlantilla:
      type: object
      properties:
        id:                 { type: integer }
        id_iter_plantilla:  { type: integer }
        titulo:             { type: string }
        descripcion:        { type: string }
        dias_desde_etapa:   { type: integer }
        dias_habiles:       { type: boolean }
        id_prioridad:       { type: integer }
        id_rol_responsable: { type: integer }
        es_hito_critico:    { type: boolean }
        active:             { type: boolean }

    # ── Tareas ────────────────────────────────────────────────────────────────
    Tarea:
      type: object
      properties:
        id:                   { type: integer }
        id_expediente:        { type: integer }
        id_expediente_etapa:  { type: integer }
        id_tarea_plantilla:   { type: integer }
        titulo:               { type: string }
        descripcion:          { type: string }
        id_usuario_asignado:  { type: integer }
        id_usuario_creador:   { type: integer }
        id_prioridad:         { type: integer }
        id_estado_tarea:      { type: integer }
        fecha_limite:         { type: string, format: date }
        fecha_completado:     { type: string, format: date-time }
        es_hito_preclusivo:   { type: boolean }
        observaciones:        { type: string }
        created_at:           { type: string, format: date-time }
        active:               { type: boolean }

    ChecklistItem:
      type: object
      properties:
        id:           { type: integer }
        id_tarea:     { type: integer }
        descripcion:  { type: string }
        completado:   { type: boolean }
        created_at:   { type: string, format: date-time }
        active:       { type: boolean }

    # ── Actuaciones ───────────────────────────────────────────────────────────
    Actuacion:
      type: object
      properties:
        id:                   { type: integer }
        id_expediente:        { type: integer }
        id_expediente_etapa:  { type: integer }
        fecha:                { type: string, format: date }
        id_tipo_actuacion:    { type: integer }
        titulo:               { type: string }
        descripcion:          { type: string }
        autoridad_emite:      { type: string }
        id_usuario_registra:  { type: integer }
        es_hito:              { type: boolean }
        url_rama_judicial:    { type: string }
        created_at:           { type: string, format: date-time }
        active:               { type: boolean }

    # ── Notificaciones ────────────────────────────────────────────────────────
    Notificacion:
      type: object
      properties:
        id:                     { type: integer }
        id_expediente:          { type: integer }
        id_expediente_etapa:    { type: integer }
        id_actuacion:           { type: integer }
        id_tipo_notificacion:   { type: integer }
        id_medio_notificacion:  { type: integer }
        parte_notificada:       { type: string }
        destinatario:           { type: string }
        direccion_o_correo:     { type: string }
        fecha_realizacion:      { type: string, format: date }
        fecha_surtimiento:      { type: string, format: date }
        dias_plazo:             { type: integer }
        fecha_vencimiento:      { type: string, format: date }
        objeto_notificacion:    { type: string }
        estado:                 { type: string }
        observaciones:          { type: string }
        active:                 { type: boolean }

    # ── Audiencias ────────────────────────────────────────────────────────────
    Audiencia:
      type: object
      properties:
        id:                     { type: integer }
        id_expediente:          { type: integer }
        id_expediente_etapa:    { type: integer }
        tipo_audiencia:         { type: string }
        fecha_programada:       { type: string, format: date-time }
        modalidad:              { type: string, enum: [presencial, virtual, mixta] }
        enlace_virtual:         { type: string }
        juzgado_o_autoridad:    { type: string }
        direccion_fisica:       { type: string }
        asistentes:             { type: string }
        id_usuario_responsable: { type: integer }
        estado:                 { type: string }
        resultado:              { type: string }
        observaciones:          { type: string }
        active:                 { type: boolean }

    # ── Documentos ────────────────────────────────────────────────────────────
    Documento:
      type: object
      properties:
        id:                   { type: integer }
        id_expediente:        { type: integer }
        id_tipo_documento:    { type: integer }
        nombre_archivo:       { type: string }
        titulo:               { type: string }
        descripcion:          { type: string }
        url_storage:          { type: string }
        mime_type:            { type: string }
        tamano_bytes:         { type: integer }
        fecha_documento:      { type: string, format: date }
        fecha_carga:          { type: string, format: date-time }
        id_usuario_carga:     { type: integer }
        id_expediente_etapa:  { type: integer }
        version:              { type: integer, default: 1 }
        visibilidad_cliente:  { type: boolean }
        active:               { type: boolean }

    # ── Financiero ────────────────────────────────────────────────────────────
    Honorario:
      type: object
      properties:
        id:                      { type: integer }
        id_expediente:           { type: integer }
        id_usuario:              { type: integer }
        modalidad:               { type: string }
        monto_total_pactado:     { type: number }
        moneda:                  { type: string, example: COP }
        porcentaje_cuota_litis:  { type: number }
        fecha_pacto:             { type: string, format: date }
        forma_pago:              { type: string }
        numero_cuotas:           { type: integer }
        valor_cuota:             { type: number }
        estado:                  { type: string }
        active:                  { type: boolean }

    Pago:
      type: object
      properties:
        id:               { type: integer }
        id_expediente:    { type: integer }
        id_honorario:     { type: integer }
        fecha_pago:       { type: string, format: date }
        monto:            { type: number }
        moneda:           { type: string, example: COP }
        metodo_pago:      { type: string }
        numero_referencia: { type: string }
        estado:           { type: string }
        active:           { type: boolean }

    GastoProceso:
      type: object
      properties:
        id:              { type: integer }
        id_expediente:   { type: integer }
        fecha_gasto:     { type: string, format: date }
        categoria_gasto: { type: string }
        descripcion:     { type: string }
        monto:           { type: number }
        moneda:          { type: string, example: COP }
        proveedor:       { type: string }
        reembolsable:    { type: boolean }
        reembolsado:     { type: boolean }
        active:          { type: boolean }

    ResumenFinanciero:
      type: object
      properties:
        honorarios_pactados: { type: number }
        total_pagado:        { type: number }
        saldo_pendiente:     { type: number }
        total_gastos:        { type: number }

    # ── Kanban ────────────────────────────────────────────────────────────────
    Tablero:
      type: object
      properties:
        id:                      { type: integer }
        nombre:                  { type: string }
        descripcion:             { type: string }
        tipo_granularidad:       { type: string }
        tipo_ambito:             { type: string }
        id_expediente:           { type: integer }
        id_usuario_propietario:  { type: integer }
        es_publico:              { type: boolean }
        active:                  { type: boolean }

    ColumnaKanban:
      type: object
      properties:
        id:          { type: integer }
        id_tablero:  { type: integer }
        nombre:      { type: string }
        orden:       { type: integer }
        color:       { type: string }
        wip_limit:   { type: integer }
        es_inicial:  { type: boolean }
        es_final:    { type: boolean }
        active:      { type: boolean }

    KanbanPosicion:
      type: object
      properties:
        id:                   { type: integer }
        id_tablero:           { type: integer }
        id_columna:           { type: integer }
        tipo_entidad:         { type: string, enum: [TAREA, ETAPA] }
        id_tarea:             { type: integer }
        id_expediente_etapa:  { type: integer }
        orden_vertical:       { type: integer }
        active:               { type: boolean }

    # ── Colaboración ──────────────────────────────────────────────────────────
    Etiqueta:
      type: object
      properties:
        id:          { type: integer }
        nombre:      { type: string }
        color:       { type: string }
        icono:       { type: string }
        descripcion: { type: string }
        active:      { type: boolean }

    Comentario:
      type: object
      properties:
        id:                   { type: integer }
        tipo_entidad:         { type: string }
        id_tarea:             { type: integer }
        id_expediente_etapa:  { type: integer }
        id_usuario_autor:     { type: integer }
        id_parent:            { type: integer }
        contenido:            { type: string }
        editado:              { type: boolean }
        created_at:           { type: string, format: date-time }
        active:               { type: boolean }

    Adjunto:
      type: object
      properties:
        id:                   { type: integer }
        tipo_entidad:         { type: string }
        id_tarea:             { type: integer }
        id_expediente_etapa:  { type: integer }
        id_comentario:        { type: integer }
        nombre_archivo:       { type: string }
        url_archivo:          { type: string }
        mime_type:            { type: string }
        tamano_bytes:         { type: integer }
        active:               { type: boolean }

    Dependencia:
      type: object
      properties:
        id:               { type: integer }
        tipo_dependencia: { type: string }
        es_bloqueante:    { type: boolean }
        active:           { type: boolean }

# ──────────────────────────────────────────────────────────────────────────────
# PATHS
# ──────────────────────────────────────────────────────────────────────────────
paths:

  # ── AUTH ────────────────────────────────────────────────────────────────────
  /auth/register:
    post:
      tags: [Auth]
      summary: Registrar nuevo usuario
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre, email, password]
              properties:
                nombre:   { type: string }
                email:    { type: string, format: email }
                password: { type: string, minLength: 8 }
      responses:
        '201':
          description: Usuario creado, pendiente de activación
          content:
            application/json:
              schema:
                type: object
                properties:
                  pendingActivation: { type: boolean }
                  user: { $ref: '#/components/schemas/UserPublic' }
        '400': { description: Datos inválidos,    content: { application/json: { schema: { $ref: '#/components/schemas/ValidationError' } } } }
        '409': { description: Email ya registrado, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /auth/login:
    post:
      tags: [Auth]
      summary: Iniciar sesión
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:    { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Login exitoso — devuelve accessToken y establece cookie refreshToken
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { description: Datos inválidos }
        '401': { description: Credenciales incorrectas }
        '403': { description: Cuenta inactiva }
        '423': { description: Cuenta bloqueada temporalmente }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Cerrar sesión (limpia la cookie refreshToken)
      responses:
        '200': { description: Sesión cerrada }

  /auth/me:
    get:
      tags: [Auth]
      summary: Obtener perfil del usuario autenticado
      responses:
        '200':
          description: Datos del usuario actual
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPublic' }
        '401': { description: No autenticado }
        '404': { description: Usuario no encontrado }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Renovar accessToken usando la cookie refreshToken
      security: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }
        '401': { description: Cookie refreshToken ausente o inválida }

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Solicitar enlace de recuperación de contraseña
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200': { description: Respuesta siempre 200 por seguridad }
        '400': { description: Email inválido }

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Restablecer contraseña con token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:    { type: string }
                password: { type: string, minLength: 8 }
      responses:
        '200': { description: Contraseña actualizada }
        '400': { description: Token inválido/expirado o password muy corto }

  /auth/verify-email:
    get:
      tags: [Auth]
      summary: Verificar email con token
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        '200': { description: Email verificado }
        '400': { description: Token ausente o expirado }

  # ── CATÁLOGOS ───────────────────────────────────────────────────────────────
  /catalogos/roles:
    get:
      tags: [Catálogos]
      summary: Listar roles
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Role' }
    post:
      tags: [Catálogos]
      summary: Crear rol (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre]
              properties:
                nombre:      { type: string }
                descripcion: { type: string }
      responses:
        '201': { description: Creado }
        '403': { description: Solo admin }

  /catalogos/roles/{id}:
    put:
      tags: [Catálogos]
      summary: Actualizar rol
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { description: Actualizado }
        '404': { description: No encontrado }
    delete:
      tags: [Catálogos]
      summary: Eliminar rol (soft delete)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204': { description: Eliminado }

  /catalogos/tipo-proceso:
    get:
      tags: [Catálogos]
      summary: Listar tipos de proceso
      responses:
        '200': { content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CatalogItem' } } } } }
    post:
      tags: [Catálogos]
      summary: Crear tipo de proceso
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [nombre], properties: { nombre: { type: string } } }
      responses:
        '201': { description: Creado }

  /catalogos/tipo-proceso/{id}:
    put:
      tags: [Catálogos]
      summary: Actualizar tipo de proceso
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        '200': { description: Actualizado }
    delete:
      tags: [Catálogos]
      summary: Eliminar tipo de proceso
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '204': { description: Eliminado }

